<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikoversigt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js" defer></script>
    <script src="App.js" defer></script>
</head>
<body>
    <div id="app" class="container mt-4">
        <h1>Musikoversigt</h1>
        <p v-if="errorMessage" class="text-danger" role="alert">{{ errorMessage }}</p>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Titel</th>
                        <th scope="col">Kunstner</th>
                        <th scope="col">Varighed (sekunder)</th>
                        <th scope="col">Udgivelsesår</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(record, index) in musicRecords" :key="index">
                        <td>{{ record.title }}</td>
                        <td>{{ record.artist }}</td>
                        <td>{{ record.duration }}</td>
                        <td>{{ record.publicationYear }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
